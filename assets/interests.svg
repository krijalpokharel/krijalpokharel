ont-size="24" font-weight="bold" fill="#ff9a1e">Open Source</text><text x="28" y="86" font-family="'Courier New',Consolas,monospace" font-size="17" fill="#ebebf5" opacity=".85">Learning by reading and sharing code.</text><circle cx="460" cy="26" r="5" fill="#50ff96" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="3.8s" repeatCount="indefinite"/></circle></g></svg>