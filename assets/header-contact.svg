<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 80" width="1000" height="80"><defs>
<linearGradient id="g" x1="0" x2="1"><stop offset="0" stop-color="#ff9a1e"/><stop offset="1" stop-color="#50ff96"/></linearGradient>
<filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
</defs>
<rect width="1000" height="80" fill="#0a0814" rx="10"/>
<rect x="1" y="1" width="998" height="78" fill="none" stroke="url(#g)" stroke-width="1.5" rx="10" opacity=".6"/>
<g transform="translate(46 40)"><circle r="20" fill="none" stroke="#ff9a1e" stroke-width="2" stroke-dasharray="8 6"><animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="10s" repeatCount="indefinite"/></circle>
<rect x="-6" y="-6" width="12" height="12" fill="#50ff96" transform="rotate(45)" filter="url(#glow)"/></g>
<text x="90" y="49" font-family="'Courier New',Consolas,monospace" font-size="28" font-weight="bold" fill="url(#g)" letter-spacing="3">CONNECT WITH ME</text>
<line x1="90" y1="62" x2="400" y2="62" stroke="#ff9a1e" stroke-width="2" opacity=".7"/>
<circle cx="960" cy="40" r="6" fill="#50ff96" filter="url(#glow)"><animate attributeName="opacity" values="1;.2;1" dur="2s" repeatCount="indefinite"/></circle>
</svg>